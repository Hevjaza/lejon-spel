name: Uppdatera data
on:
  schedule:
    - cron: "7 */2 * * *"   # varannan timme (UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta nästa omgångar (Svenska Spel + ATG)
        run: python3 update_data.py
      - name: Commit om något ändrats
        run: |
          git config user.name "lejon-spel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Ingen ändring"; exit 0; fi
          git commit -m "Data: automatisk uppdatering $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
